[workspace]
resolver = "3"
members = ["crates/rv-core", "crates/rv-video", "crates/rv-ffi", "crates/rv-app", "crates/rv-fm"]
# Vendored third-party crates build as dependencies but are not tested as workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rv-core = { path = "crates/rv-core" }
rv-video = { path = "crates/rv-video" }
rv-fm = { path = "crates/rv-fm" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
eframe = "0.37"
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = "0.37"
egui_plot = "0.38"
walkers = "0.64"
rfd = "0.17"
serde_json = "1"
rayon = "1"
# FilmCraft's pure-Rust decoders, vendored (see vendor/filmcraft/README.md).
filmcraft-h264 = { path = "vendor/filmcraft/h264" }
filmcraft-hevc = { path = "vendor/filmcraft/hevc" }

[profile.dev.package."*"]
opt-level = 2
