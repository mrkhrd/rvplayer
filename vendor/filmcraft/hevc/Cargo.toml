[package]
name = "filmcraft-hevc"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265), vendored from FilmCraft"
version = "0.14.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
filmcraft-bitstream = { path = "../bitstream" }
thiserror = "2"
rayon = { version = "1", optional = true }
