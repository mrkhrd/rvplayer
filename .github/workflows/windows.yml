# Builds the single-file Windows program (qt/single.cmd) on every push to master, runs the Rust
# tests and publishes the program as a release. The static Qt and MapLibre take an hour or two
# to build the first time; each is cached as soon as it is built, so a later failure or timeout
# does not cost it again.
name: Windows build

on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write  # the release

concurrency:
  group: windows-build
  cancel-in-progress: false

env:
  # Cache keys of the static dependencies: the versions pinned in qt/single.cmd and
  # qt/maplibre.cmd, and a revision to bump when their build options change (MapLibre's
  # follows Qt's, as it is built against it).
  QT_CACHE: static-qt-6.10.3-r1
  MAPLIBRE_CACHE: static-maplibre-3.0.0-qt-6.10.3-r1
  # The Rust core uses the static MSVC runtime, as qt/CMakeLists.txt does with RV_STATIC.
  RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      # Third-party code runs with write access to the repository: actions are pinned to commits.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Static Qt from the cache
        id: qt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: deps/qt-static
          key: ${{ env.QT_CACHE }}

      # Each long step has a limit of its own: a hang fails it within hours, not at the job's end.
      - name: Build the static Qt
        if: steps.qt.outputs.cache-hit != 'true'
        timeout-minutes: 150
        shell: cmd
        run: qt\single.cmd qt

      - name: Keep the static Qt
        if: steps.qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: deps/qt-static
          key: ${{ env.QT_CACHE }}

      - name: Static MapLibre from the cache
        id: maplibre
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: deps/maplibre-static
          key: ${{ env.MAPLIBRE_CACHE }}

      - name: Build the static MapLibre
        if: steps.maplibre.outputs.cache-hit != 'true'
        timeout-minutes: 120
        shell: cmd
        run: qt\single.cmd deps

      - name: Keep the static MapLibre
        if: steps.maplibre.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: deps/maplibre-static
          key: ${{ env.MAPLIBRE_CACHE }}

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target/static"

      - name: Rust tests
        timeout-minutes: 60
        run: cargo test --release --workspace --exclude rv-app --target-dir target/static

      - name: Build the program
        timeout-minutes: 60
        shell: cmd
        run: qt\single.cmd

      - name: Name the release
        id: release
        shell: pwsh
        run: |
          $version = (Select-String -Path qt/CMakeLists.txt -Pattern 'set\(RV_VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $build = "$version.${{ github.run_number }}"
          Copy-Item dist/RVPlayer.exe "dist/RVPlayer-$build-win64.exe"
          $notes = (Get-Content assets/app/whatsnew_en.txt -Raw).TrimEnd()
          @(
            "One program file for 64-bit Windows 10 and 11: download and run, nothing to install.",
            "",
            '```text', $notes, '```',
            "",
            "Built from $env:GITHUB_SHA."
          ) | Set-Content -Encoding utf8 dist/notes.md
          "build=$build" >> $env:GITHUB_OUTPUT

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: v${{ steps.release.outputs.build }}
          target_commitish: ${{ github.sha }}
          name: RV Player ${{ steps.release.outputs.build }}
          body_path: dist/notes.md
          files: dist/RVPlayer-${{ steps.release.outputs.build }}-win64.exe
          fail_on_unmatched_files: true
