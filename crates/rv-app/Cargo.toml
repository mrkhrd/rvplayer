[package]
name = "rv-app"
description = "Dashcam video and GPS track viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rvplayer"
path = "src/main.rs"

[dependencies]
rv-core.workspace = true
rv-video.workspace = true
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
walkers.workspace = true
rfd.workspace = true

[dev-dependencies]
rv-core = { workspace = true, features = ["testutil"] }
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }
